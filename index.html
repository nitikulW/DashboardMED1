<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัญชียาร้านยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===================== ตัวแปรสี (โหมดสว่าง) ===================== */
:root {
  --bg: #eef4f3;
  --surface: #ffffff;
  --surface-2: #f4f8f7;
  --border: #e3ecea;
  --text: #102624;
  --text-2: #5d706d;
  --primary: #0d9488;
  --primary-2: #2dd4bf;          /* ปลายสีของ gradient */
  --primary-soft: #d5f5ef;
  --primary-text: #0f766e;
  --track: #e8efee;              /* พื้นหลังแถบ progress / แท่งที่ถูกจาง */
  --danger: #b91c1c;
  --danger-soft: #fee2e2;
  --hero-1: #0f766e; --hero-2: #14b8a6; --hero-3: #5eead4;
  --shadow: 0 1px 2px rgba(15,60,55,.05), 0 8px 24px -8px rgba(15,60,55,.12);
  --shadow-hover: 0 2px 4px rgba(15,60,55,.06), 0 14px 32px -10px rgba(15,60,55,.22);
  --k1: #d5f5ef; --k1i: #0f766e;
  --k2: #dbeefe; --k2i: #0369a1;
  --k3: #fdf0c8; --k3i: #b45309;
  --k4: #ece8fe; --k4i: #6d28d9;
  --pill-l: 94%; --pill-tl: 28%; --pill-s: 65%;   /* สีป้ายหมวด */
  color-scheme: light;
}
/* ===================== ตัวแปรสี (โหมดมืด) ===================== */
:root[data-theme="dark"] {
  --bg: #08100f;
  --surface: #111c1b;
  --surface-2: #162423;
  --border: #213432;
  --text: #e7f2f0;
  --text-2: #93aaa6;
  --primary: #2dd4bf;
  --primary-2: #0f766e;
  --primary-soft: #123f3b;
  --primary-text: #5eead4;
  --track: #1c2e2c;
  --danger: #fca5a5;
  --danger-soft: #3b1414;
  --hero-1: #063b37; --hero-2: #0b5e57; --hero-3: #14b8a6;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --shadow-hover: 0 8px 24px -8px rgba(0,0,0,.6);
  --k1: #123f3b; --k1i: #5eead4;
  --k2: #0c3550; --k2i: #7dd3fc;
  --k3: #43300d; --k3i: #fcd34d;
  --k4: #2c2056; --k4i: #c4b5fd;
  --pill-l: 20%; --pill-tl: 80%; --pill-s: 45%;
  color-scheme: dark;
}

/* ===================== พื้นฐาน ===================== */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Sarabun", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* อนิเมชันตอนโหลด: การ์ดค่อย ๆ ลอยขึ้น */
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0ms); }
@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; }
  html { scroll-behavior: auto; }
}

/* ===================== โครงหน้า: sidebar + เนื้อหา ===================== */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 3px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 22px; }
.brand b { display: block; font-size: 16px; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--text-2); }
.brand-icon {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  background: linear-gradient(135deg, var(--hero-2), var(--hero-1)); color: #fff;
  display: grid; place-items: center; box-shadow: 0 6px 14px -6px var(--hero-1);
}
.nav-label { font-size: 11px; letter-spacing: .04em; color: var(--text-2); padding: 16px 12px 6px; font-weight: 700; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); text-decoration: none; font-weight: 500;
  position: relative; transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.nav-link.active::before {
  content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 4px;
  border-radius: 0 4px 4px 0; background: var(--primary);
}
.nav-link.disabled { opacity: .5; cursor: not-allowed; }
.nav-link .badge { margin-left: auto; white-space: nowrap; font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 7px; border-radius: 999px; }
.nav-link svg { width: 19px; height: 19px; flex: none; }
.sidebar-foot {
  margin-top: auto; font-size: 12px; color: var(--text-2);
  display: flex; gap: 8px; align-items: center;
  padding: 12px; border-radius: 12px; background: var(--surface-2);
}
.sidebar-foot svg { width: 16px; flex: none; color: var(--primary-text); }

.main { min-width: 0; padding: 0 28px 48px; }

/* ===================== แถบบน ===================== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  display: flex; align-items: center; gap: 14px;
  padding: 16px 0 12px;
}
.topbar .crumb { font-size: 13px; color: var(--text-2); }
.topbar h1 { font-size: 19px; margin: 0; line-height: 1.3; }
.search { margin-left: auto; position: relative; width: min(360px, 40vw); }
.search input {
  width: 100%; padding: 10px 14px 10px 38px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
}
.search input:focus, select:focus, .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; color: var(--text-2); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { color: var(--primary-text); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

/* ===================== Hero (แถบหัว gradient) ===================== */
.hero {
  position: relative; overflow: hidden;
  border-radius: 22px; padding: 26px 30px; margin-bottom: 16px;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--hero-3) 55%, transparent) 0%, transparent 55%),
    linear-gradient(120deg, var(--hero-1) 0%, var(--hero-2) 100%);
  color: #fff;
  box-shadow: 0 18px 40px -22px var(--hero-1);
}
.hero h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.25; max-width: 70%; }
.hero p { margin: 6px 0 18px; opacity: .85; font-size: 14px; max-width: 62%; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 10px; position: relative; z-index: 1; }
.hero-stat {
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22);
  backdrop-filter: blur(6px); border-radius: 12px; padding: 7px 14px;
  font-size: 13px;
}
.hero-stat b { font-size: 18px; margin-right: 4px; }
/* ภาพประกอบมุมขวา: วางบนวงกลมโปร่งแสง ให้ภาพลอยเด่นจากพื้น gradient */
.hero-art {
  position: absolute; right: 36px; bottom: 0; top: 0; width: 270px;
  display: flex; align-items: flex-end; justify-content: center; pointer-events: none;
}
.hero-art::before {
  content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%;
  right: 40px; top: 50%; transform: translateY(-50%);
  background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
}
.hero-art img { position: relative; height: 92%; width: auto; filter: drop-shadow(0 8px 14px rgba(0,0,0,.18)); }

/* ===================== แถวตัวกรอง ===================== */
.filters {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px;
  position: sticky; top: 70px; z-index: 19; background: var(--bg); padding: 4px 0 10px;
}
.select { position: relative; }
.select select {
  appearance: none; -webkit-appearance: none;
  padding: 9px 36px 9px 14px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); min-width: 180px; cursor: pointer; box-shadow: var(--shadow);
}
.select::after {
  content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px;
  border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.select select.on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); font-weight: 600; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-weight: 500;
}
.btn:hover:not(:disabled) { color: var(--primary-text); border-color: var(--primary); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
/* ป้ายตัวกรองที่ใช้อยู่ */
.chips { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 6px 4px 12px; border-radius: 999px;
  background: var(--primary-soft); color: var(--primary-text);
  border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
  font-size: 13px; font-weight: 600; cursor: pointer; animation: rise .25s both;
}
.chip small { font-weight: 500; opacity: .75; }
.chip .x { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 18%, transparent); }
.chip:hover .x { background: var(--primary); color: var(--surface); }
.chip svg { width: 11px; height: 11px; }

/* ===================== การ์ดทั่วไป ===================== */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow); padding: 20px 22px;
  min-width: 0; transition: box-shadow .2s, transform .2s;
}
.card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-head .ico {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-text);
}
.card-head .ico svg { width: 18px; height: 18px; }
.card h2 { font-size: 16px; margin: 0; line-height: 1.3; }
.card .hint { color: var(--text-2); font-size: 13px; margin: 2px 0 0; }
section { scroll-margin-top: 140px; }

/* ===================== KPI ===================== */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
.kpi { position: relative; overflow: hidden; }
.kpi:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.kpi::after { /* วงกลมจาง ๆ มุมขวาบน ให้การ์ดมีมิติ */
  content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px;
  border-radius: 50%; background: var(--kc); opacity: .45; pointer-events: none;
}
.kpi-top { display: flex; align-items: center; gap: 10px; }
.kpi-icon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex: none; position: relative; z-index: 1; }
.kpi-icon svg { width: 21px; height: 21px; }
.kpi-label { color: var(--text-2); font-size: 14px; font-weight: 600; }
.kpi-value { font-size: 34px; font-weight: 800; line-height: 1.1; margin-top: 14px; letter-spacing: -.01em; }
.kpi-value small { font-size: 14px; font-weight: 500; color: var(--text-2); margin-left: 5px; letter-spacing: 0; }
.kpi-foot { color: var(--text-2); font-size: 13px; margin-top: 6px; min-height: 20px; }
.mini-track { height: 6px; border-radius: 4px; background: var(--track); margin-top: 12px; overflow: hidden; display: flex; }
.mini-track span { display: block; height: 100%; transition: width .5s cubic-bezier(.2,.7,.2,1); }

/* ===================== กราฟ ===================== */
.charts { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-bottom: 16px; }
.chart-wrap { position: relative; }
/* แถบข้อมูลของแท่งที่ชี้อยู่ (แทน tooltip ลอยที่บังกราฟ) */
/* ความสูงคงที่: ถ้าสูงไม่เท่ากัน กราฟจะขยับใต้เมาส์แล้ววนเปลี่ยนไม่หยุด */
.bar-info {
  height: 72px; overflow: hidden; box-sizing: border-box; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px dashed var(--border);
  font-size: 13px; color: var(--text-2); transition: background .15s, border-color .15s;
}
.bar-info.on { background: var(--primary-soft); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); color: var(--text); }
.bar-info b { font-size: 15px; color: var(--primary-text); }
.bar-info .n { font-weight: 700; margin-left: 6px; }
.bar-info .names {
  margin-top: 2px; color: var(--text-2); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.donut-box { position: relative; height: 210px; }
.legend { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 2px; }
.legend li {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; cursor: pointer;
  transition: background .15s, opacity .15s;
}
.legend li:hover { background: var(--surface-2); }
.legend li.dim { opacity: .4; }
.legend li.sel { background: var(--primary-soft); }
.legend .sw { width: 28px; height: 28px; border-radius: 8px; flex: none; display: grid; place-items: center; }
.legend .sw svg { width: 16px; height: 16px; }
.legend .v { margin-left: auto; color: var(--text-2); font-size: 13px; }
.legend .v b { color: var(--text); font-weight: 700; margin-right: 2px; }

/* ATC: แถบ progress */
.atc-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 28px; }
.atc-row { padding: 8px 10px; border-radius: 12px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; transition: background .15s, opacity .15s; }
.atc-row:hover { background: var(--surface-2); }
.atc-row.dim { opacity: .4; }
.atc-row.sel { background: var(--primary-soft); }
.atc-top { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 6px; }
.atc-code {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; background: var(--primary-soft); color: var(--primary-text);
}
.atc-top .v { margin-left: auto; font-weight: 700; }
.atc-top .v small { color: var(--text-2); font-weight: 500; margin-left: 4px; }
.bar { height: 9px; background: var(--track); border-radius: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary-2), var(--primary)); border-radius: 6px; transition: width .5s cubic-bezier(.2,.7,.2,1); }

/* ===================== ตาราง ===================== */
.table-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.table-head .count { color: var(--text-2); font-size: 13px; margin-left: auto; background: var(--surface-2); padding: 4px 12px; border-radius: 999px; }
.table-scroll { overflow-x: auto; margin: 0 -22px; padding: 0 22px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
th {
  text-align: left; font-weight: 600; color: var(--text-2); font-size: 13px;
  padding: 10px 12px; background: var(--surface-2); white-space: nowrap;
  cursor: pointer; user-select: none; position: sticky; top: 0;
}
th:first-child { border-radius: 10px 0 0 10px; }
th:last-child { border-radius: 0 10px 10px 0; }
th:hover { color: var(--text); }
th .arr { opacity: .35; margin-left: 4px; font-size: 11px; }
th.sorted { color: var(--primary-text); }
th.sorted .arr { opacity: 1; }
th.r, td.r { text-align: right; }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.active td { background: var(--primary-soft); }
.sku { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--text-2); }
.name-cell { display: flex; align-items: center; gap: 10px; }
.form-ico {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  display: grid; place-items: center; background: var(--fc-bg); color: var(--fc);
}
.form-ico svg { width: 17px; height: 17px; }
.gname { font-weight: 600; }
.gname + div { font-size: 12px; color: var(--text-2); }
/* ป้ายหมวด: สีมาจาก hue ที่คำนวณให้แต่ละหมวด */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  background: hsl(var(--h) var(--pill-s) var(--pill-l));
  color: hsl(var(--h) 60% var(--pill-tl));
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.empty { text-align: center; color: var(--text-2); padding: 44px 10px; }
.empty svg { width: 40px; height: 40px; opacity: .5; display: block; margin: 0 auto 8px; }

/* ===================== แผงรายละเอียด (ด้านขวา) ===================== */
.scrim { position: fixed; inset: 0; background: rgba(5,20,18,.35); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.scrim.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 100vw);
  background: var(--surface); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.7,.2,1); z-index: 50;
  overflow-y: auto; box-shadow: -20px 0 40px -20px rgba(0,0,0,.25);
}
.drawer.show { transform: none; }
.drawer-hero {
  padding: 22px 24px 20px; color: #fff;
  background: linear-gradient(120deg, var(--hero-1), var(--hero-2));
  display: flex; gap: 14px; align-items: flex-start;
}
.drawer-hero .form-ico { width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,.18); color: #fff; }
.drawer-hero .form-ico svg { width: 26px; height: 26px; }
.drawer-hero h3 { margin: 2px 0 0; font-size: 21px; line-height: 1.25; }
.drawer-hero .sku { color: rgba(255,255,255,.75); }
.drawer-hero .str { opacity: .85; font-size: 14px; }
.drawer-hero .icon-btn { margin-left: auto; background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.25); color: #fff; box-shadow: none; }
.drawer-body { padding: 20px 24px 28px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: 12px; color: var(--text-2); }
.fact b { font-weight: 600; }
.box { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
.box h4 { margin: 0 0 10px; font-size: 14px; }
.atc-path { display: grid; gap: 0; font-size: 13px; position: relative; }
.atc-path div { display: flex; gap: 10px; align-items: center; padding: 5px 0 5px 18px; position: relative; }
.atc-path div::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.atc-path div::after { content: ""; position: absolute; left: 0; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translateY(-50%); background: var(--surface); border: 2px solid var(--primary); }
.atc-path div:last-child::after { background: var(--primary); }
.atc-path code { font-weight: 700; color: var(--primary-text); min-width: 64px; }
.sib { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 14px; border: 0; background: none; width: 100%; text-align: left; }
.sib:hover { background: var(--surface-2); }
.sib .form-ico { width: 26px; height: 26px; }

/* ===================== สถานะโหลด / ผิดพลาด ===================== */
.state { padding: 80px 20px; text-align: center; color: var(--text-2); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: var(--danger-soft); color: var(--danger); border: 1px solid currentColor;
  border-radius: 16px; padding: 18px 22px; margin: 20px 0; text-align: left;
}
.error-box h2 { margin: 0 0 6px; font-size: 17px; }
.error-box ul { margin: 6px 0 0; padding-left: 20px; }
.error-box code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; }

/* ===================== รองรับจอเล็ก ===================== */
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  .hero-art { width: 170px; opacity: .5; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 45; width: 250px;
    transform: translateX(-100%); transition: transform .25s;
  }
  .sidebar.show { transform: none; box-shadow: var(--shadow-hover); }
  .menu-btn { display: grid; }
  .main { padding: 0 16px 32px; }
  .topbar { flex-wrap: wrap; }
  .search { order: 5; width: 100%; margin-left: 0; }
  .topbar .icon-btn.theme { margin-left: auto; }
  .hero { padding: 22px; }
  .hero h2, .hero p { max-width: none; }
  .hero h2 { font-size: 22px; }
  .hero-art { display: none; }
  .atc-list { grid-template-columns: 1fr; }
  .filters { position: static; }
  .select { flex: 1 1 150px; }
  .select select { width: 100%; min-width: 0; }
}
@media (max-width: 480px) {
  .kpis { grid-template-columns: 1fr; }
  .kpi-value { font-size: 30px; }
  .facts { grid-template-columns: 1fr; }
}
</style>

<!-- แผงรายละเอียดยา -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
/* =====================================================================
   1) ค่าคงที่: การจัดกลุ่มรูปแบบยา ไอคอน และชื่อกลุ่ม ATC ระดับที่ 1 (WHO)
   - ไม่มีชื่อหมวดหรือตัวเลขจาก drugs.json เขียนไว้ในโค้ด
   - ตารางด้านล่างเป็น "พจนานุกรม" สำหรับแปลรหัสเป็นคำอ่านเท่านั้น
   ===================================================================== */
// ไอคอนของแต่ละกลุ่มรูปแบบยา
const ICONS = {
  tablet:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/></svg>',
  capsule: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7Z"/><path d="m8.5 8.5 7 7"/></svg>',
  liquid:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 2h6v3H9z"/><path d="M8 5h8l1 3v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8z"/><path d="M7 13h10"/></svg>',
  topical: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l-2 13H8z"/><path d="M9 16h6v3a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>',
  drops:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>',
  other:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>',
};
const FORM_GROUPS = [
  { name: "ยาเม็ด",            icon: "tablet",  forms: ["tablet", "chewable tablet", "sublingual tablet", "film-coated tablet"] },
  { name: "แคปซูล",            icon: "capsule", forms: ["capsule"] },
  { name: "ยาน้ำ/ผงรับประทาน", icon: "liquid",  forms: ["syrup", "suspension", "dry syrup", "oral suspension", "oral solution", "powder for oral solution"] },
  { name: "ยาใช้ภายนอก",       icon: "topical", forms: ["cream", "gel", "ointment", "solution", "lotion"] },
  { name: "ยาพ่น/ยาหยอด",      icon: "drops",   forms: ["inhaler", "nasal spray", "eye drops", "ear drops"] },
];
const OTHER_GROUP = "อื่น ๆ";
const FORM_TH = {
  "tablet": "ยาเม็ด", "chewable tablet": "ยาเม็ดเคี้ยว", "sublingual tablet": "ยาเม็ดอมใต้ลิ้น",
  "capsule": "แคปซูล", "syrup": "ยาน้ำเชื่อม", "suspension": "ยาน้ำแขวนตะกอน",
  "dry syrup": "ยาผงแห้งผสมน้ำ", "oral suspension": "ยาน้ำแขวนตะกอน", "oral solution": "ยาน้ำใส",
  "powder for oral solution": "ผงละลายน้ำ", "cream": "ครีม", "gel": "เจล", "ointment": "ขี้ผึ้ง",
  "solution": "ยาน้ำใช้ภายนอก", "inhaler": "ยาพ่นสูด", "nasal spray": "ยาพ่นจมูก",
  "eye drops": "ยาหยอดตา", "ear drops": "ยาหยอดหู",
};
const ATC_TH = {
  A: "ทางเดินอาหารและเมตาบอลิซึม", B: "เลือดและอวัยวะสร้างเลือด", C: "หัวใจและหลอดเลือด",
  D: "ผิวหนัง", G: "ระบบสืบพันธุ์และปัสสาวะ", H: "ฮอร์โมน (ยกเว้นฮอร์โมนเพศ)",
  J: "ยาต้านการติดเชื้อ", L: "ยาต้านมะเร็งและปรับภูมิคุ้มกัน", M: "กล้ามเนื้อและกระดูก",
  N: "ระบบประสาท", P: "ยาต้านปรสิต", R: "ระบบทางเดินหายใจ", S: "อวัยวะรับความรู้สึก", V: "อื่น ๆ",
};
const UNIT_TH = { tablet: "เม็ด", capsule: "แคปซูล", bottle: "ขวด", tube: "หลอด", inhaler: "หลอดพ่น", sachet: "ซอง" };
const REQUIRED = ["sku", "generic_name", "strength", "dosage_form", "unit", "category", "atc_code", "reorder_level"];
// สีของกลุ่มรูปแบบยา (ใช้ทั้ง donut, legend และไอคอนในตาราง)
const GROUP_COLORS = {
  light: ["#0d9488", "#0ea5e9", "#f59e0b", "#8b5cf6", "#ec4899", "#64748b"],
  dark:  ["#2dd4bf", "#7dd3fc", "#fcd34d", "#c4b5fd", "#f9a8d4", "#cbd5e1"],
};

/* ตัวช่วยแปลงค่า */
const formToGroup = new Map();
FORM_GROUPS.forEach(g => g.forms.forEach(f => formToGroup.set(f, g.name)));
const groupOf = f => formToGroup.get(String(f).toLowerCase().trim()) || OTHER_GROUP;
const groupIcon = g => ICONS[(FORM_GROUPS.find(x => x.name === g) || { icon: "other" }).icon];
const atcOf = code => String(code || "?").charAt(0).toUpperCase();
const atcName = l => ATC_TH[l] || "ไม่ระบุกลุ่ม";
const fmt = n => Math.round(n).toLocaleString("th-TH");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isDark = () => document.documentElement.dataset.theme === "dark";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =====================================================================
   2) สถานะของหน้า (ตัวกรอง การเรียง และข้อมูล)
   ===================================================================== */
const state = {
  meta: {}, items: [],
  category: "", group: "", atc: "", q: "",
  sortKey: "category", sortDir: 1,
  selected: null,
};
const charts = {};
const $ = id => document.getElementById(id);

// สีประจำหมวด: กระจาย hue ด้วย "มุมทองคำ" ให้หมวดที่อยู่ติดกันได้สีต่างกันชัด
const catHue = c => Math.round((Math.max(0, state.cats.indexOf(c)) * 137.508 + 170) % 360);
// สีประจำกลุ่มรูปแบบยา
const groupColor = g => {
  const pal = isDark() ? GROUP_COLORS.dark : GROUP_COLORS.light;
  const i = state.groups.indexOf(g);
  return pal[(i < 0 ? pal.length - 1 : i) % pal.length];
};
// ไอคอนรูปแบบยาแบบมีพื้นสี
const formBadge = g => `<span class="form-ico" style="--fc:${groupColor(g)};--fc-bg:${groupColor(g)}22" title="${esc(g)}">${groupIcon(g)}</span>`;

/* วันที่ภาษาไทยบนแถบบน */
$("today").textContent = new Date().toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

/* =====================================================================
   3) โหมดมืด/สว่าง: เริ่มตามเครื่อง และจำค่าที่ผู้ใช้เลือก
   ===================================================================== */
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function savedTheme() { try { return localStorage.getItem("drug-theme"); } catch (e) { return null; } }
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("themeBtn").innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
  $("themeBtn").title = t === "dark" ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด";
}
applyTheme(savedTheme() || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("themeBtn").addEventListener("click", () => {
  const t = isDark() ? "light" : "dark";
  try { localStorage.setItem("drug-theme", t); } catch (e) {}
  applyTheme(t);
  if (state.items.length) render(); // วาดใหม่ให้สีกราฟ/ไอคอนตรงกับโหมด
});
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* =====================================================================
   4) โหลดข้อมูลและตรวจสอบความถูกต้อง
   ===================================================================== */
function showError(title, lines) {
  $("root").innerHTML = `<div class="error-box" role="alert"><h2>${esc(title)}</h2>
    <ul>${lines.map(l => `<li>${l}</li>`).join("")}</ul></div>`;
}

async function load() {
  // เปิดไฟล์ตรง ๆ (file://) เบราว์เซอร์จะไม่ยอมให้ fetch
  if (location.protocol === "file:") {
    showError("เปิดไฟล์โดยตรงไม่ได้", [
      "เบราว์เซอร์บล็อกการอ่าน <code>drugs.json</code> เมื่อเปิดแบบ <code>file://</code>",
      "ให้เปิดผ่าน <b>Live Server</b> ใน VS Code (คลิกขวาที่ index.html → Open with Live Server)",
      "หรืออัปโหลดขึ้น <b>GitHub Pages</b> แล้วเปิดจากลิงก์นั้น",
    ]);
    return;
  }
  let res;
  try {
    res = await fetch("drugs.json", { cache: "no-cache" });
  } catch (e) {
    showError("เชื่อมต่อไม่ได้", ["ไม่สามารถอ่านไฟล์ <code>drugs.json</code> ได้: " + esc(e.message)]);
    return;
  }
  if (!res.ok) {
    showError("ไม่พบไฟล์ข้อมูล", [`โหลด <code>drugs.json</code> ไม่สำเร็จ (HTTP ${res.status})`, "ตรวจว่าไฟล์อยู่โฟลเดอร์เดียวกับ index.html และสะกดชื่อถูก"]);
    return;
  }
  let data;
  try {
    data = JSON.parse(await res.text());
  } catch (e) {
    showError("ไฟล์ไม่ใช่ JSON ที่ถูกต้อง", [esc(e.message), "ตรวจเครื่องหมาย , { } [ ] และเครื่องหมายคำพูดในไฟล์"]);
    return;
  }
  if (!data || !Array.isArray(data.items)) {
    showError("โครงสร้างข้อมูลไม่ถูกต้อง", ["ต้องมีฟิลด์ <code>items</code> ที่เป็น array"]);
    return;
  }
  // ตรวจฟิลด์ที่จำเป็นของทุกรายการ
  const problems = [];
  data.items.forEach((it, i) => {
    const miss = REQUIRED.filter(k => it == null || it[k] === undefined || it[k] === null || it[k] === "");
    if (miss.length) problems.push(`รายการที่ ${i + 1} (SKU: <code>${esc(it && it.sku || "ไม่มี")}</code>) ขาดฟิลด์ ${miss.map(m => `<code>${m}</code>`).join(", ")}`);
  });
  if (problems.length) {
    showError(`ข้อมูลไม่ครบ ${problems.length} รายการ`, problems.slice(0, 20).concat(problems.length > 20 ? [`และอีก ${problems.length - 20} รายการ`] : []));
    return;
  }

  // เตรียมข้อมูล: เพิ่มกลุ่มรูปแบบยาและกลุ่ม ATC ให้แต่ละรายการ
  state.meta = data.meta || {};
  state.items = data.items.map(it => ({
    ...it,
    reorder_level: Number(it.reorder_level),
    _group: groupOf(it.dosage_form),
    _atc: atcOf(it.atc_code),
  }));
  buildPage();
}

/* =====================================================================
   5) สร้างโครงหน้า (ทำครั้งเดียวหลังโหลดข้อมูลสำเร็จ)
   ===================================================================== */
function buildPage() {
  const m = state.meta, items = state.items;
  const title = m.title || "บัญชียา";
  document.title = title;

  // รายชื่อหมวด: ใช้ลำดับจาก meta.categories แล้วเติมหมวดที่พบใน items แต่ไม่อยู่ใน meta
  const cats = [...(m.categories || [])];
  items.forEach(it => { if (!cats.includes(it.category)) cats.push(it.category); });
  state.cats = cats.filter(c => items.some(it => it.category === c));
  // กลุ่มรูปแบบยา: แสดงเฉพาะกลุ่มที่มีข้อมูล ("อื่น ๆ" ต่อท้าย)
  state.groups = [...FORM_GROUPS.map(g => g.name), OTHER_GROUP].filter(g => items.some(it => it._group === g));
  // กลุ่ม ATC ที่มีข้อมูล เรียงตามตัวอักษร
  state.atcs = [...new Set(items.map(it => it._atc))].sort();
  const nGen = new Set(items.map(it => it.generic_name)).size;

  const opt = (v, t) => `<option value="${esc(v)}">${esc(t)}</option>`;
  const head = (icon, h, hint) => `<div class="card-head"><div class="ico">${icon}</div><div><h2>${h}</h2><p class="hint">${hint}</p></div></div>`;
  $("root").innerHTML = `
    <div class="hero rise">
      <h2>${esc(title)}</h2>
      <p>${esc(m.note || "")}</p>
      <div class="hero-stats">
        <div class="hero-stat"><b class="num">${fmt(items.length)}</b>SKU</div>
        <div class="hero-stat"><b class="num">${fmt(state.cats.length)}</b>หมวดยา</div>
        <div class="hero-stat"><b class="num">${fmt(nGen)}</b>ตัวยาสามัญ</div>
        <div class="hero-stat"><b class="num">${fmt(state.atcs.length)}</b>กลุ่ม ATC</div>
      </div>
      ${HERO_ART}
    </div>

    <div class="filters" role="group" aria-label="ตัวกรอง">
      <div class="select"><select id="fCat" aria-label="หมวดยา">${opt("", "ทุกหมวดยา")}${state.cats.map(c => opt(c, c)).join("")}</select></div>
      <div class="select"><select id="fGroup" aria-label="รูปแบบยา">${opt("", "ทุกรูปแบบยา")}${state.groups.map(g => opt(g, g)).join("")}</select></div>
      <div class="select"><select id="fAtc" aria-label="กลุ่ม ATC">${opt("", "ทุกกลุ่ม ATC")}${state.atcs.map(a => opt(a, a + " · " + atcName(a))).join("")}</select></div>
      <button class="btn" id="clearBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg>ล้างตัวกรอง</button>
      <div class="chips" id="chips"></div>
    </div>

    <section id="overview" class="kpis" aria-label="ตัวชี้วัดหลัก">

/* =====================================================================
   6) ตัวกรอง: ฟังก์ชันกรองโดย "ยกเว้น" ตัวกรองบางตัวได้
   (ให้กราฟหมวดยังเห็นทุกหมวด แม้เลือกหมวดใดหมวดหนึ่งอยู่)
   ===================================================================== */
function filtered(except) {
  const q = state.q.trim().toLowerCase();
  return state.items.filter(it =>
    (except === "category" || !state.category || it.category === state.category) &&
    (except === "group" || !state.group || it._group === state.group) &&
    (except === "atc" || !state.atc || it._atc === state.atc) &&
    (!q || it.generic_name.toLowerCase().includes(q) || it.sku.toLowerCase().includes(q) || it.atc_code.toLowerCase().includes(q))
  );
}
const countBy = (arr, key) => arr.reduce((m, it) => m.set(it[key], (m.get(it[key]) || 0) + 1), new Map());

/* =====================================================================
   7) วาดทุกส่วนใหม่เมื่อตัวกรองเปลี่ยน
   ===================================================================== */
function render() {
  const rows = filtered();
  // ซิงก์ค่าใน dropdown และไฮไลต์ตัวกรองที่ใช้อยู่
  [["fCat", "category"], ["fGroup", "group"], ["fAtc", "atc"]].forEach(([id, k]) => {
    $(id).value = state[k];
    $(id).classList.toggle("on", !!state[k]);
  });
  renderChips();
  renderKpis(rows);
  renderCharts();
  renderAtc();
  renderTable(rows);
}

/* ---------- ป้ายตัวกรองที่ใช้อยู่ (กด ✕ เพื่อเอาออกทีละตัว) ---------- */
function renderChips() {
  const chips = [];
  if (state.category) chips.push(["category", "หมวด", state.category]);
  if (state.group) chips.push(["group", "รูปแบบ", state.group]);
  if (state.atc) chips.push(["atc", "ATC", state.atc + " · " + atcName(state.atc)]);
  if (state.q.trim()) chips.push(["q", "ค้นหา", `“${state.q.trim()}”`]);
  $("clearBtn").disabled = !chips.length;
  $("chips").innerHTML = chips.map(([k, l, v]) =>
    `<button class="chip" data-k="${k}" aria-label="เอาตัวกรอง ${esc(l)} ออก"><small>${l}:</small> ${esc(v)}<span class="x">${ICON_X}</span></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    state[b.dataset.k] = "";
    if (b.dataset.k === "q") $("q").value = "";
    render();
  });
}

/* ---------- ตัวเลขนับขึ้น (อนิเมชัน) ---------- */
function countUp(el, to, suffix) {
  const from = el._v ?? 0;
  el._v = to;
  if (reduceMotion || from === to) { el.innerHTML = fmt(to) + suffix; return; }
  const t0 = performance.now(), dur = 650;
  cancelAnimationFrame(el._raf);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = fmt(from + (to - from) * e) + suffix;
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

/* ---------- KPI 4 การ์ด ---------- */
function renderKpis(rows) {
  const total = state.items.length;
  // 1) จำนวน SKU + แถบสัดส่วนที่ผ่านตัวกรอง
  countUp($("kSku"), rows.length, "<small>SKU</small>");
  $("kSkuFoot").textContent = rows.length === total ? "แสดงครบทุกรายการ" : `กำลังแสดง ${fmt(rows.length)} จาก ${fmt(total)}`;
  $("kSkuBar").innerHTML = `<span style="width:${rows.length / total * 100}%;background:var(--k1i)"></span>`;

  // 2) หมวดยา + แถบสัดส่วนหมวดที่มีข้อมูล
  const cats = [...countBy(rows, "category")].sort((a, b) => b[1] - a[1]);
  countUp($("kCat"), cats.length, "<small>หมวด</small>");
  $("kCatFoot").textContent = cats.length ? `มากสุด: ${cats[0][0]} (${cats[0][1]})` : "—";
  $("kCatBar").innerHTML = `<span style="width:${cats.length / state.cats.length * 100}%;background:var(--k2i)"></span>`;

  // 3) ตัวยาสามัญ + ตัวที่มีหลาย SKU
  const gens = [...countBy(rows, "generic_name")];
  const multi = gens.filter(g => g[1] > 1).map(g => g[0]);
  countUp($("kGen"), gens.length, "<small>ตัว</small>");
  $("kGenFoot").textContent = multi.length
    ? `${multi.length} ตัวมีหลายขนาด: ${multi.slice(0, 2).join(", ")}${multi.length > 2 ? ` +${multi.length - 2}` : ""}`
    : "ไม่มีตัวยาที่มีหลาย SKU";
  $("kGenBar").innerHTML = gens.length ? `<span style="width:${(gens.length - multi.length) / gens.length * 100}%;background:var(--k3i)"></span><span style="width:${multi.length / gens.length * 100}%;background:var(--k3i);opacity:.45"></span>` : "";

  // 4) รูปแบบหลัก + แถบซ้อนสัดส่วนทุกกลุ่ม
  const groups = [...countBy(rows, "_group")].sort((a, b) => b[1] - a[1]);
  if (groups.length) {
    const pct = n => Math.round(n / rows.length * 100) + "%";
    $("kForm").innerHTML = `${esc(groups[0][0])}<small>${pct(groups[0][1])}</small>`;
    $("kFormFoot").textContent = groups.slice(1, 3).map(g => `${g[0]} ${pct(g[1])}`).join(" · ") || "มีรูปแบบเดียว";
    $("kFormBar").innerHTML = state.groups.map(g => {
      const n = (groups.find(x => x[0] === g) || [0, 0])[1];
      return `<span style="width:${n / rows.length * 100}%;background:${groupColor(g)}" title="${esc(g)} ${n}"></span>`;
    }).join("");
  } else {
    $("kForm").textContent = "–"; $("kFormFoot").textContent = ""; $("kFormBar").innerHTML = "";
  }
}

/* ---------- กราฟ (Chart.js) ---------- */
// ปลั๊กอินเขียนตัวเลขท้ายแท่ง
const barLabels = {
  id: "barLabels",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    ctx.save();
    ctx.font = "700 12.5px Sarabun, sans-serif";
    ctx.fillStyle = cssVar("--text");
    ctx.textBaseline = "middle";
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      ctx.globalAlpha = chart.$dim && chart.$dim[i] ? 0.45 : 1;
      ctx.fillText(chart.data.datasets[0].data[i], bar.x + 8, bar.y);
    });
    ctx.restore();
  },
};
// ปลั๊กอินเขียนยอดรวมกลางวง donut
const donutCenter = {
  id: "donutCenter",
  afterDraw(chart) {
    const { ctx, chartArea: a } = chart;
    const total = chart.data.datasets[0].data.reduce((s, v) => s + v, 0);
    const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = cssVar("--text");
    ctx.font = "800 30px Sarabun, sans-serif";
    ctx.fillText(total, x, y + 4);
    ctx.fillStyle = cssVar("--text-2");
    ctx.font = "13px Sarabun, sans-serif";
    ctx.fillText("รายการ", x, y + 24);
    ctx.restore();
  },
};
// สีแท่งแบบ gradient (แท่งที่ไม่ได้เลือกเป็นสีจาง)
function barColor(c) {
  const chart = c.chart, a = chart.chartArea;
  if (chart.$dim && chart.$dim[c.dataIndex]) return cssVar("--track");
  if (!a) return cssVar("--primary");
  const g = chart.ctx.createLinearGradient(a.left, 0, a.right, 0);
  g.addColorStop(0, cssVar("--primary-2"));
  g.addColorStop(1, cssVar("--primary"));
  return g;
}

/* แถบข้อมูลเหนือกราฟแท่ง: ชี้แท่งไหนก็แสดงชื่อหมวด จำนวน และรายชื่อยา
   ถ้าไม่ได้ชี้แท่ง จะแสดงหมวดที่เลือกอยู่ หรือคำแนะนำการใช้งาน */
function showBarInfo(cat) {
  const box = $("barInfo");
  if (!box) return;
  const c = cat || state.category;
  if (!c) {
    box.classList.remove("on");
    box.innerHTML = "ชี้ที่แท่งกราฟเพื่อดูรายชื่อยาในหมวดนั้น";
    return;
  }
  const rows = filtered("category").filter(it => it.category === c);
  const names = [...new Set(rows.map(it => it.generic_name))];
  box.classList.add("on");
  box.innerHTML = `<b>${esc(c)}</b><span class="n num">${rows.length} รายการ</span>
    <div class="names">${names.length ? esc(names.slice(0, 10).join(", ")) + (names.length > 10 ? ` และอีก ${names.length - 10} ตัว` : "") : "ไม่มีรายการที่ตรงกับตัวกรอง"}</div>`;
}

function renderCharts() {
  if (typeof Chart === "undefined") {
    $("barWrap").innerHTML = '<p class="hint">โหลด Chart.js ไม่ได้ (ตรวจการเชื่อมต่ออินเทอร์เน็ต)</p>';
    return;
  }
  Chart.defaults.font.family = "Sarabun, sans-serif";
  Chart.defaults.color = cssVar("--text-2");
  const tooltip = {
    backgroundColor: isDark() ? "#e7f2f0" : "#102624",
    titleColor: isDark() ? "#102624" : "#fff",
    bodyColor: isDark() ? "#25403c" : "#d5e6e3",
    padding: 12, cornerRadius: 10, displayColors: false,
    titleFont: { size: 14, weight: "700" }, bodyFont: { size: 13 },
  };

  /* ---- กราฟแท่ง: นับตามหมวด โดยไม่สนตัวกรองหมวด ---- */
  const base = filtered("category");
  const byCat = countBy(base, "category");
  // เรียงตามจำนวนในข้อมูลทั้งหมด (ลำดับแท่งจึงไม่กระโดดเวลากรอง)
  const allCount = countBy(state.items, "category");
  const cats = state.cats.map(c => [c, byCat.get(c) || 0]).sort((a, b) => allCount.get(b[0]) - allCount.get(a[0]));
  const labels = cats.map(c => c[0]), values = cats.map(c => c[1]);
  const dim = labels.map(c => !!state.category && c !== state.category);
  $("barWrap").style.height = (labels.length * 32 + 10) + "px";

  if (charts.bar) {
    charts.bar.$dim = dim;
    charts.bar.data.labels = labels;
    charts.bar.data.datasets[0].data = values;
    charts.bar.options.scales.y.ticks.color = cssVar("--text");
    Object.assign(charts.bar.options.plugins.tooltip, tooltip);
    charts.bar.update();
  } else {
    charts.bar = new Chart($("barChart"), {
      type: "bar",
      data: { labels, datasets: [{ data: values, backgroundColor: barColor, borderRadius: 7, borderSkipped: false, barThickness: 18 }] },
      options: {
        indexAxis: "y", maintainAspectRatio: false,
        animation: { duration: reduceMotion ? 0 : 500 },
        layout: { padding: { right: 30 } },
        scales: {
          x: { display: false, beginAtZero: true },
          y: { grid: { display: false }, border: { display: false }, ticks: { color: cssVar("--text"), font: { size: 13 } } },
        },
        plugins: {
          legend: { display: false },
          // ปิด tooltip ลอย แล้วแสดงข้อมูลในแถบด้านบนแทน (ไม่บังแท่งกราฟ)
          tooltip: { enabled: false },
        },
        onClick: (e, els) => {
          if (!els.length) return;
          const c = charts.bar.data.labels[els[0].index];
          state.category = state.category === c ? "" : c;
          render();
        },
        onHover: (e, els) => {
          e.native.target.style.cursor = els.length ? "pointer" : "default";
          const c = els.length ? charts.bar.data.labels[els[0].index] : null;
          if (c !== charts.bar.$hover) { charts.bar.$hover = c; showBarInfo(c); }
        },
      },
      plugins: [barLabels],
    });
    charts.bar.$dim = dim;
  }
  showBarInfo(charts.bar.$hover);

  /* ---- Donut: นับตามกลุ่มรูปแบบยา โดยไม่สนตัวกรองรูปแบบ ---- */
  const baseG = filtered("group");
  const byG = countBy(baseG, "_group");
  const gLabels = state.groups, gValues = gLabels.map(g => byG.get(g) || 0);
  const gColors = gLabels.map(g => groupColor(g) + (!state.group || g === state.group ? "" : "38"));
  const sum = gValues.reduce((s, v) => s + v, 0);

  if (charts.donut) {
    const ds = charts.donut.data.datasets[0];
    Object.assign(ds, { data: gValues, backgroundColor: gColors, borderColor: cssVar("--surface") });
    Object.assign(charts.donut.options.plugins.tooltip, tooltip);
    charts.donut.update();
  } else {
    charts.donut = new Chart($("donutChart"), {
      type: "doughnut",
      data: { labels: gLabels, datasets: [{ data: gValues, backgroundColor: gColors, borderColor: cssVar("--surface"), borderWidth: 4, borderRadius: 6, hoverOffset: 8 }] },
      options: {
        maintainAspectRatio: false, cutout: "70%",
        animation: { duration: reduceMotion ? 0 : 700 },
        plugins: {
          legend: { display: false },
          tooltip: { ...tooltip, callbacks: { label: t => `${t.raw} รายการ (${sum ? Math.round(t.raw / sum * 100) : 0}%)` } },
        },
        onClick: (e, els) => {
          if (!els.length) return;
          const g = gLabels[els[0].index];
          state.group = state.group === g ? "" : g;
          render();
        },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; },
      },
      plugins: [donutCenter],
    });
  }
  // legend แบบ HTML (มีไอคอน จำนวน และ %)
  $("donutLegend").innerHTML = gLabels.map((g, i) => {
    const cls = state.group ? (g === state.group ? "sel" : "dim") : "";
    const pct = sum ? Math.round(gValues[i] / sum * 100) : 0;
    const c = groupColor(g);
    return `<li class="${cls}" data-g="${esc(g)}" tabindex="0" role="button">
      <span class="sw" style="background:${c}22;color:${c}">${groupIcon(g)}</span>${esc(g)}
      <span class="v num"><b>${gValues[i]}</b> · ${pct}%</span></li>`;
  }).join("");
  $("donutLegend").querySelectorAll("li").forEach(li => {
    const go = () => { state.group = state.group === li.dataset.g ? "" : li.dataset.g; render(); };
    li.onclick = go;
    li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

/* ---------- กลุ่ม ATC (แถบ progress) ---------- */
function renderAtc() {
  const base = filtered("atc");
  const by = countBy(base, "_atc");
  const all = countBy(state.items, "_atc");
  // เรียงตามจำนวนในข้อมูลทั้งหมด (ตำแหน่งไม่กระโดดเวลากรอง)
  const list = state.atcs.map(a => [a, by.get(a) || 0]).sort((x, y) => all.get(y[0]) - all.get(x[0]) || x[0].localeCompare(y[0]));
  const max = Math.max(1, ...list.map(l => l[1]));
  const total = base.length || 1;
  $("atcList").innerHTML = list.map(([a, n]) => {
    const cls = state.atc ? (a === state.atc ? "sel" : "dim") : "";
    return `<button class="atc-row ${cls}" data-a="${esc(a)}">
      <div class="atc-top"><span class="atc-code">${esc(a)}</span>${esc(atcName(a))}
      <span class="v num">${n}<small>${Math.round(n / total * 100)}%</small></span></div>
      <div class="bar"><span style="width:${n / max * 100}%"></span></div></button>`;
  }).join("");
  $("atcList").querySelectorAll(".atc-row").forEach(b => b.onclick = () => {
    state.atc = state.atc === b.dataset.a ? "" : b.dataset.a;
    render();
  });
}

/* ---------- ตารางรายการยา ---------- */
const COLS = [
  { k: "sku", t: "SKU" },
  { k: "generic_name", t: "ชื่อสามัญ" },
  { k: "strength", t: "ความแรง" },
  { k: "dosage_form", t: "รูปแบบ" },
  { k: "category", t: "หมวด" },
  { k: "atc_code", t: "ATC" },
  { k: "reorder_level", t: "จุดสั่งซื้อ", r: true },
];
function renderTable(rows) {
  $("thead").innerHTML = COLS.map(c => {
    const on = state.sortKey === c.k;
    return `<th class="${c.r ? "r " : ""}${on ? "sorted" : ""}" data-k="${c.k}" aria-sort="${on ? (state.sortDir > 0 ? "ascending" : "descending") : "none"}">
      ${c.t}<span class="arr">${on ? (state.sortDir > 0 ? "▲" : "▼") : "↕"}</span></th>`;
  }).join("");
  $("thead").querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    state.sortDir = state.sortKey === k ? -state.sortDir : 1;
    state.sortKey = k;
    renderTable(filtered());
  });

  // หมวดเรียงตามลำดับใน meta.categories, คอลัมน์อื่นเรียงตามตัวอักษร/ตัวเลข
  const k = state.sortKey, d = state.sortDir;
  const val = it => k === "category" ? state.cats.indexOf(it.category) : it[k];
  const sorted = [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "th")) * d || a.sku.localeCompare(b.sku);
  });

  $("tCount").textContent = `แสดง ${fmt(rows.length)} จาก ${fmt(state.items.length)} รายการ`;
  if (!sorted.length) {
    $("tbody").innerHTML = `<tr><td class="empty" colspan="${COLS.length}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 11h5"/></svg>
      ไม่พบรายการที่ตรงกับตัวกรอง</td></tr>`;
    return;
  }
  $("tbody").innerHTML = sorted.map(it => `
    <tr data-sku="${esc(it.sku)}" class="${state.selected === it.sku ? "active" : ""}" tabindex="0">
      <td class="sku">${esc(it.sku)}</td>
      <td><div class="name-cell">${formBadge(it._group)}<div><div class="gname">${esc(it.generic_name)}</div></div></div></td>
      <td>${esc(it.strength)}</td>
      <td>${esc(FORM_TH[it.dosage_form] || it.dosage_form)}</td>
      <td><span class="pill" style="--h:${catHue(it.category)}">${esc(it.category)}</span></td>
      <td class="sku">${esc(it.atc_code)}</td>
      <td class="r num"><b>${fmt(it.reorder_level)}</b> ${esc(UNIT_TH[it.unit] || it.unit)}</td>
    </tr>`).join("");
  $("tbody").querySelectorAll("tr").forEach(tr => {
    tr.onclick = () => openDrawer(tr.dataset.sku);
    tr.onkeydown = e => { if (e.key === "Enter") openDrawer(tr.dataset.sku); };
  });
}

/* =====================================================================
   8) แผงรายละเอียดยา (คลิกแถวในตาราง)
   ===================================================================== */
function openDrawer(sku) {
  const it = state.items.find(x => x.sku === sku);
  if (!it) return;
  state.selected = sku;
  const unit = UNIT_TH[it.unit] || it.unit;
  const code = it.atc_code;
  // แยกรหัส ATC ออกเป็นระดับ
  const levels = [
    [code.slice(0, 1), atcName(code[0])],
    [code.slice(0, 3), "กลุ่มการรักษา"],
    [code.slice(0, 4), "กลุ่มย่อยทางเภสัชวิทยา"],
    [code.slice(0, 5), "กลุ่มย่อยทางเคมี"],
    [code, "ตัวยา: " + it.generic_name],
  ].filter(l => l[0]);
  const siblings = state.items.filter(x => x.generic_name === it.generic_name && x.sku !== it.sku);

  $("drawer").innerHTML = `
    <div class="drawer-hero">
      <span class="form-ico">${groupIcon(it._group)}</span>
      <div><div class="sku">${esc(it.sku)}</div><h3>${esc(it.generic_name)}</h3>
      <div class="str">${esc(it.strength)}</div></div>
      <button class="icon-btn" id="closeDrawer" aria-label="ปิด">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-body">
      <div style="margin-bottom:14px"><span class="pill" style="--h:${catHue(it.category)}">${esc(it.category)}</span></div>
      <div class="facts">
        <div class="fact"><span>รูปแบบยา</span><b>${esc(FORM_TH[it.dosage_form] || it.dosage_form)}</b></div>
        <div class="fact"><span>กลุ่มรูปแบบ</span><b>${esc(it._group)}</b></div>
        <div class="fact"><span>หน่วยนับ</span><b>${esc(unit)}</b></div>
        <div class="fact"><span>จุดสั่งซื้อ</span><b>${fmt(it.reorder_level)} ${esc(unit)}</b></div>
      </div>
      <div class="box">
        <h4>รหัส ATC: ${esc(code)}</h4>
        <div class="atc-path">${levels.map(l => `<div><code>${esc(l[0])}</code>${esc(l[1])}</div>`).join("")}</div>
      </div>
      ${siblings.length ? `<div class="box"><h4>${esc(it.generic_name)} ขนาด/รูปแบบอื่นในร้าน</h4>
        ${siblings.map(s => `<button class="sib" data-sku="${esc(s.sku)}">${formBadge(s._group)}<span><b>${esc(s.strength)}</b> · ${esc(FORM_TH[s.dosage_form] || s.dosage_form)}<br><span class="sku">${esc(s.sku)}</span></span></button>`).join("")}</div>` : ""}
    </div>`;
  $("drawer").classList.add("show");
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("show");
  $("closeDrawer").onclick = closeDrawer;
  $("closeDrawer").focus();
  $("drawer").querySelectorAll(".sib").forEach(b => b.onclick = () => openDrawer(b.dataset.sku));
  document.querySelectorAll("#tbody tr").forEach(tr => tr.classList.toggle("active", tr.dataset.sku === sku));
}
function closeDrawer() {
  state.selected = null;
  $("drawer").classList.remove("show");
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("show");
  document.querySelectorAll("#tbody tr.active").forEach(tr => tr.classList.remove("active"));
}

/* =====================================================================
   9) Sidebar: เมนูบนมือถือ และไฮไลต์ส่วนที่กำลังดู
   ===================================================================== */
$("menuBtn").onclick = () => { $("sidebar").classList.add("show"); $("scrim").classList.add("show"); };
$("scrim").onclick = () => { $("sidebar").classList.remove("show"); closeDrawer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); $("sidebar").classList.remove("show"); } });
document.querySelectorAll("[data-nav]").forEach(a => a.addEventListener("click", () => {
  $("sidebar").classList.remove("show");
  if (!$("drawer").classList.contains("show")) $("scrim").classList.remove("show");
}));
// ไฮไลต์เมนูตามส่วนที่เลื่อนมาถึง
window.addEventListener("scroll", () => {
  let cur = "overview";
  ["overview", "charts", "list"].forEach(id => {
    const el = $(id);
    if (el && el.getBoundingClientRect().top < 200) cur = id;
  });
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + cur));
}, { passive: true });

/* เริ่มทำงาน */
load();
</script>
</body>
</html>
