<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัญชียาร้านยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* =====================================================================
   Design tokens แบบ shadcn/ui (background / foreground / card / muted /
   accent / border / ring / chart-1..6) — โทนกลาง zinc + สีหลัก teal
   ===================================================================== */
:root {
  --radius: 0.625rem;
  --background: #ffffff;
  --foreground: #09090b;
  --card: #ffffff;
  --card-foreground: #09090b;
  --popover: #ffffff;
  --primary: #0d9488;
  --primary-foreground: #f0fdfa;
  --secondary: #f4f4f5;
  --secondary-foreground: #18181b;
  --muted: #f4f4f5;
  --muted-foreground: #71717a;
  --accent: #f4f4f5;
  --accent-foreground: #18181b;
  --destructive: #dc2626;
  --border: #e4e4e7;
  --input: #e4e4e7;
  --ring: #5eead4;
  --sidebar: #fafafa;
  --sidebar-foreground: #3f3f46;
  --sidebar-accent: #f0f0f2;
  --sidebar-border: #e4e4e7;
  --primary-soft: color-mix(in srgb, var(--primary) 10%, transparent);
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / .08), 0 1px 2px -1px rgb(0 0 0 / .08);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  --dot-l: 45%;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --background: #0a0a0a;
  --foreground: #fafafa;
  --card: #141414;
  --card-foreground: #fafafa;
  --popover: #171717;
  --primary: #2dd4bf;
  --primary-foreground: #042f2e;
  --secondary: #262626;
  --secondary-foreground: #fafafa;
  --muted: #262626;
  --muted-foreground: #a1a1aa;
  --accent: #262626;
  --accent-foreground: #fafafa;
  --destructive: #f87171;
  --border: rgb(255 255 255 / .1);
  --input: rgb(255 255 255 / .15);
  --ring: #0f766e;
  --sidebar: #141414;
  --sidebar-foreground: #d4d4d8;
  --sidebar-accent: #262626;
  --sidebar-border: rgb(255 255 255 / .1);
  --shadow-xs: none;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / .4);
  --shadow-lg: 0 10px 30px -10px rgb(0 0 0 / .7);
  --dot-l: 65%;
  color-scheme: dark;
}

/* ===================== พื้นฐาน ===================== */
* { box-sizing: border-box; border-color: var(--border); }
html, body { margin: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Geist", "IBM Plex Sans Thai", system-ui, sans-serif;
  background: var(--sidebar);
  color: var(--foreground);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: "Geist Mono", ui-monospace, Consolas, monospace; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent); }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .4s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0ms); }
@keyframes pulse { 50% { opacity: .5; } }
.skeleton { background: var(--muted); border-radius: calc(var(--radius) - 2px); animation: pulse 2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .rise, .skeleton { animation: none; }
  html { scroll-behavior: auto; }
}

/* ===================== Button / Badge / Kbd / Input / Select ===================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: calc(var(--radius) - 2px);
  font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer;
  border: 1px solid transparent; background: none; transition: background .15s, color .15s, opacity .15s;
}
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn-outline { border-color: var(--input); background: var(--background); box-shadow: var(--shadow-xs); }
.btn-outline:hover { background: var(--accent); }
.btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { opacity: .9; }
.btn-sm { height: 32px; padding: 0 10px; font-size: 13px; gap: 6px; }
.btn-icon { width: 36px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }
.btn-icon-xs { width: 28px; height: 28px; padding: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  border-radius: calc(var(--radius) - 4px); padding: 2px 8px;
  font-size: 12px; font-weight: 500; line-height: 1.35; border: 1px solid transparent;
}
.badge svg { width: 12px; height: 12px; }
.badge-outline { border-color: var(--border); color: var(--foreground); }
.badge-secondary { background: var(--secondary); color: var(--secondary-foreground); }
.badge-primary { background: var(--primary-soft); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 25%, transparent); }
/* ป้ายหมวด: badge outline + จุดสีจาก hue ที่คำนวณให้แต่ละหมวด */
.badge-cat::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--h) 70% var(--dot-l)); }

.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 4px; background: var(--muted); color: var(--muted-foreground);
  font: 500 11px "Geist Mono", ui-monospace, monospace; border: 1px solid var(--border);
}

.input {
  height: 36px; width: 100%; border-radius: calc(var(--radius) - 2px);
  border: 1px solid var(--input); background: var(--background); padding: 0 12px;
  box-shadow: var(--shadow-xs); transition: box-shadow .15s, border-color .15s;
}
.input::placeholder { color: var(--muted-foreground); }
.input:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 40%, transparent); }

/* Select: native <select> แต่งให้เหมือน SelectTrigger */
.select { position: relative; display: inline-flex; }
.select select {
  appearance: none; -webkit-appearance: none; cursor: pointer;
  height: 36px; padding: 0 34px 0 12px; border-radius: calc(var(--radius) - 2px);
  border: 1px solid var(--input); background: var(--background); box-shadow: var(--shadow-xs);
  min-width: 170px; font-size: 14px;
}
.select select:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 40%, transparent); }
.select select.on { border-color: color-mix(in srgb, var(--primary) 50%, transparent); background: var(--primary-soft); color: var(--primary); font-weight: 500; }
.select svg { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; opacity: .5; pointer-events: none; }
.select-sm select { height: 32px; min-width: 0; font-size: 13px; padding-right: 30px; }
.select option { background: var(--popover); color: var(--foreground); }

/* Toggle group (เช่น shadcn ToggleGroup variant="outline") */
.toggle-group { display: inline-flex; border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); box-shadow: var(--shadow-xs); overflow: hidden; }
.toggle-group button {
  height: 30px; padding: 0 12px; border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--muted-foreground); transition: background .15s, color .15s;
}
.toggle-group button + button { border-left: 1px solid var(--input); }
.toggle-group button:hover { background: var(--accent); color: var(--foreground); }
.toggle-group button[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }

.separator-v { width: 1px; height: 16px; background: var(--border); flex: none; }
.separator { height: 1px; background: var(--border); border: 0; margin: 16px 0; }

/* ===================== Sidebar (variant="inset", collapsible="icon") ===================== */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 256px; flex: none; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 8px; color: var(--sidebar-foreground);
  transition: width .2s ease;
}
.sb-header { padding: 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: calc(var(--radius) - 2px); min-width: 0; }
.brand-icon {
  width: 32px; height: 32px; border-radius: calc(var(--radius) - 2px); flex: none;
  background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center;
}
.brand-icon svg { width: 16px; height: 16px; }
.brand-text { min-width: 0; line-height: 1.25; }
.brand-text b { display: block; font-size: 14px; font-weight: 600; color: var(--foreground); }
.brand-text span { font-size: 12px; color: var(--muted-foreground); }
.sb-content { flex: 1; overflow-y: auto; overflow-x: hidden; }
.sb-group { padding: 8px; }
.sb-label { height: 32px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; transition: opacity .2s; }
.sb-menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.sb-btn {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px;
  border-radius: calc(var(--radius) - 2px); color: inherit; text-decoration: none; font-size: 14px;
  white-space: nowrap; overflow: hidden; position: relative; transition: background .15s;
}
.sb-btn svg { width: 16px; height: 16px; }
.sb-btn:hover { background: var(--sidebar-accent); color: var(--foreground); }
.sb-btn.active { background: var(--sidebar-accent); color: var(--foreground); font-weight: 500; }
.sb-btn.disabled { opacity: .5; cursor: not-allowed; }
.sb-btn.disabled:hover { background: none; }
.sb-btn .badge { margin-left: auto; }
.sb-footer { padding: 8px; }
.sb-card {
  display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: var(--radius);
  border: 1px solid var(--sidebar-border); background: var(--card); box-shadow: var(--shadow-xs);
  white-space: nowrap; overflow: hidden;
}
.sb-card .avatar { width: 32px; height: 32px; border-radius: calc(var(--radius) - 2px); background: var(--muted); display: grid; place-items: center; flex: none; }
.sb-card .avatar svg { width: 16px; height: 16px; color: var(--primary); }
.sb-card div { line-height: 1.25; min-width: 0; }
.sb-card b { display: block; font-size: 13px; font-weight: 600; color: var(--foreground); }
.sb-card span { font-size: 12px; color: var(--muted-foreground); }

/* ย่อ sidebar เหลือแต่ไอคอน */
.app.collapsed .sidebar { width: 64px; }
.app.collapsed .brand-text, .app.collapsed .sb-btn .lbl, .app.collapsed .sb-btn .badge,
.app.collapsed .sb-card div { display: none; }
.app.collapsed .sb-label { opacity: 0; height: 8px; }
.app.collapsed .sb-btn { justify-content: center; padding: 0; }
.app.collapsed .sb-card { padding: 4px; border: 0; background: none; box-shadow: none; justify-content: center; }
.app.collapsed .brand { justify-content: center; padding: 6px 0; }
/* tooltip ของไอคอนเมื่อย่อ */
.app.collapsed [data-tip]:hover::after {
  content: attr(data-tip); position: fixed; left: 70px; transform: translateY(-50%); margin-top: 16px;
  background: var(--foreground); color: var(--background); font-size: 12px; font-weight: 500;
  padding: 4px 10px; border-radius: calc(var(--radius) - 4px); white-space: nowrap; z-index: 60; pointer-events: none;
}

/* SidebarInset: เนื้อหาหลักเป็นแผ่นมุมโค้งลอยบนพื้น sidebar */
.inset {
  flex: 1; min-width: 0; background: var(--background);
  margin: 8px 8px 8px 0; border-radius: calc(var(--radius) + 4px); box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}

/* ===================== Header ===================== */
.header {
  position: sticky; top: 0; z-index: 20; height: 56px;
  display: flex; align-items: center; gap: 8px; padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--background) 85%, transparent); backdrop-filter: blur(8px);
  border-radius: calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0;
}
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted-foreground); list-style: none; margin: 0; padding: 0; min-width: 0; }
.crumbs li { white-space: nowrap; }
.crumbs li.cur { color: var(--foreground); font-weight: 500; }
.crumbs svg { width: 14px; height: 14px; }
.search { margin-left: auto; position: relative; width: min(320px, 38vw); }
.search > svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted-foreground); }
.search .input { padding-left: 34px; padding-right: 40px; }
.search .kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.search .input:focus + .kbd { display: none; }

.content { padding: 24px; display: grid; gap: 16px; }
.page-title { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.page-title h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.2; }
.page-title p { margin: 4px 0 0; color: var(--muted-foreground); }

/* ===================== Card ===================== */
.card {
  background: var(--card); color: var(--card-foreground);
  border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow-xs); min-width: 0; display: flex; flex-direction: column;
}
.card-header { padding: 20px 24px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.card-title { font-size: 16px; font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -.01em; }
.card-desc { font-size: 13px; color: var(--muted-foreground); margin: 0; grid-column: 1; }
.card-action { grid-column: 2; grid-row: 1 / span 2; align-self: start; }
.card-content { padding: 16px 24px 20px; flex: 1; }
.card-footer { padding: 0 24px 20px; display: grid; gap: 4px; font-size: 13px; }
section { scroll-margin-top: 72px; }

/* Intro card (แทน hero gradient เดิม) */
.intro { flex-direction: row; overflow: hidden; position: relative; }
.intro-body { padding: 24px; flex: 1; min-width: 0; display: grid; gap: 10px; align-content: center; }
.intro-body h2 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; line-height: 1.3; }
.intro-body p { margin: 0; color: var(--muted-foreground); max-width: 68ch; }
.intro-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.intro-stats .badge { font-size: 13px; padding: 3px 10px; }
.intro-stats b { font-weight: 600; }
.intro-art {
  width: 280px; flex: none; position: relative; display: flex; align-items: flex-end; justify-content: center;
  background:
    radial-gradient(circle at 60% 55%, color-mix(in srgb, var(--primary) 22%, transparent), transparent 62%),
    linear-gradient(135deg, transparent, var(--primary-soft));
  border-left: 1px solid var(--border);
}
.intro-art img { height: 150px; width: auto; margin: 16px 0 0; }

/* ===================== Toolbar ตัวกรอง ===================== */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.chips:empty { display: none; }
.chip { cursor: pointer; padding: 2px 4px 2px 8px; font-size: 12px; animation: rise .2s both; }
.chip small { color: var(--muted-foreground); font-size: 12px; }
.chip .x { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; }
.chip:hover .x { background: color-mix(in srgb, var(--foreground) 12%, transparent); }
.chip .x svg { width: 11px; height: 11px; }

/* ===================== KPI (SectionCards) ===================== */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { background: linear-gradient(to top, var(--primary-soft), var(--card) 55%); }
.kpi .card-title { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin-top: 2px; line-height: 1.15; }
.kpi .card-title small { font-size: 14px; font-weight: 500; color: var(--muted-foreground); margin-left: 6px; letter-spacing: 0; }
.kpi .card-title.text { font-size: 22px; padding: 4px 0 3px; }
.kpi .card-footer { padding-top: 16px; }
.kpi-main { display: flex; gap: 6px; align-items: center; font-weight: 500; overflow: hidden; }
.kpi-main span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi-main svg { width: 14px; height: 14px; }
.kpi-sub { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 19px; }
.mini-track { height: 6px; border-radius: 99px; background: var(--muted); margin-top: 8px; overflow: hidden; display: flex; }
.mini-track span { display: block; height: 100%; transition: width .5s cubic-bezier(.2,.7,.2,1); }

/* ===================== กราฟ ===================== */
.charts { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
.chart-wrap { position: relative; }
/* แถบข้อมูลของแท่งที่ชี้อยู่ — ความสูงคงที่ ไม่ให้กราฟขยับใต้เมาส์ */
.bar-info {
  height: 64px; overflow: hidden; margin-bottom: 12px; padding: 9px 12px; border-radius: var(--radius);
  background: var(--muted); border: 1px dashed var(--border); font-size: 13px; color: var(--muted-foreground);
  transition: background .15s, border-color .15s;
}
.bar-info.on { background: var(--primary-soft); border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent); color: var(--foreground); }
.bar-info b { font-weight: 600; }
.bar-info .n { margin-left: 6px; }
.bar-info .names { margin-top: 2px; color: var(--muted-foreground); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.donut-box { position: relative; height: 200px; }
.legend { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 2px; }
.legend li {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: calc(var(--radius) - 2px); cursor: pointer;
  transition: background .15s, opacity .15s;
}
.legend li:hover { background: var(--accent); }
.legend li.dim { opacity: .4; }
.legend li.sel { background: var(--accent); font-weight: 500; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .v { margin-left: auto; color: var(--muted-foreground); font-size: 13px; }
.legend .v b { color: var(--foreground); font-weight: 600; margin-right: 2px; }

/* ATC: แถบ progress */
.atc-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 24px; }
.atc-row { padding: 8px; border-radius: calc(var(--radius) - 2px); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; transition: background .15s, opacity .15s; }
.atc-row:hover { background: var(--accent); }
.atc-row.dim { opacity: .4; }
.atc-row.sel { background: var(--accent); }
.atc-top { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 6px; }
.atc-code {
  width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  font: 600 12px "Geist Mono", monospace; border: 1px solid var(--border); background: var(--background);
}
.atc-row.sel .atc-code { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
.atc-top .v { margin-left: auto; font-weight: 600; }
.atc-top .v small { color: var(--muted-foreground); font-weight: 400; margin-left: 4px; }
.progress { height: 8px; background: var(--muted); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .5s cubic-bezier(.2,.7,.2,1); }

/* ===================== ตาราง (Data table) ===================== */
.table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead { background: var(--muted); position: sticky; top: 0; z-index: 1; }
th { text-align: left; font-weight: 500; color: var(--muted-foreground); height: 40px; padding: 0 4px; white-space: nowrap; }
th:first-child, td:first-child { padding-left: 12px; }
th:last-child, td:last-child { padding-right: 12px; }
th .sort { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 6px; border: 0; background: none; color: inherit; font-weight: 500; cursor: pointer; }
th .sort:hover { background: var(--accent); color: var(--foreground); }
th .sort svg { width: 14px; height: 14px; opacity: .5; }
th.sorted .sort { color: var(--foreground); }
th.sorted .sort svg { opacity: 1; }
th.r, td.r { text-align: right; }
td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: color-mix(in srgb, var(--muted) 55%, transparent); }
tbody tr.active { background: var(--muted); }
.sku { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--muted-foreground); }
.name-cell { display: flex; align-items: center; gap: 10px; }
.form-ico {
  width: 28px; height: 28px; border-radius: 7px; flex: none;
  display: grid; place-items: center; background: var(--fc-bg); color: var(--fc);
}
.form-ico svg { width: 15px; height: 15px; }
.gname { font-weight: 500; }
.empty { text-align: center; color: var(--muted-foreground); padding: 48px 10px; cursor: default; }
.empty-ico { width: 44px; height: 44px; border-radius: var(--radius); background: var(--muted); display: grid; place-items: center; margin: 0 auto 10px; color: var(--foreground); }
.empty-ico svg { width: 20px; height: 20px; }
.empty b { display: block; color: var(--foreground); font-weight: 500; }

/* Pagination */
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-top: 14px; font-size: 13px; color: var(--muted-foreground); }
.pager .grow { flex: 1; }
.pager-ctl { display: flex; align-items: center; gap: 8px; }
.pager-ctl .page { color: var(--foreground); font-weight: 500; min-width: 92px; text-align: center; }

/* ===================== Sheet (แผงรายละเอียด) ===================== */
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .5); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.overlay.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; top: 0; right: 0; height: 100vh; width: min(420px, 100vw);
  background: var(--background); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); z-index: 50;
  overflow-y: auto; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
}
.sheet.show { transform: none; }
.sheet-close { position: absolute; top: 14px; right: 14px; opacity: .7; }
.sheet-close:hover { opacity: 1; }
.sheet-header { padding: 24px 24px 0; display: flex; gap: 14px; align-items: flex-start; }
.sheet-header .form-ico { width: 44px; height: 44px; border-radius: var(--radius); }
.sheet-header .form-ico svg { width: 22px; height: 22px; }
.sheet-title { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.3; padding-right: 32px; }
.sheet-desc { margin: 2px 0 0; color: var(--muted-foreground); font-size: 14px; }
.sheet-body { padding: 20px 24px; flex: 1; }
.sheet-footer { padding: 16px 24px 24px; display: flex; gap: 8px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.fact span { display: block; font-size: 12px; color: var(--muted-foreground); }
.fact b { font-weight: 500; }
.sub-title { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.atc-path { display: grid; font-size: 13px; }
.atc-path div { display: flex; gap: 10px; align-items: center; padding: 5px 0 5px 20px; position: relative; }
.atc-path div::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.atc-path div:first-child::before { top: 50%; }
.atc-path div:last-child::before { bottom: 50%; }
.atc-path div::after { content: ""; position: absolute; left: 0; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translateY(-50%); background: var(--background); border: 2px solid var(--primary); }
.atc-path div:last-child::after { background: var(--primary); }
.atc-path code { font-family: "Geist Mono", monospace; font-weight: 500; color: var(--primary); min-width: 64px; }
.sib { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: calc(var(--radius) - 2px); cursor: pointer; font-size: 14px; border: 0; background: none; width: 100%; text-align: left; }
.sib:hover { background: var(--accent); }
.sib .form-ico { width: 26px; height: 26px; }
.sib .sku { font-size: 12px; }

/* ===================== Toast (แบบ Sonner) ===================== */
.toaster { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: grid; gap: 8px; }
.toast {
  display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 360px;
  padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--popover); color: var(--foreground); box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500;
  animation: toastIn .3s cubic-bezier(.2,.7,.2,1) both;
}
.toast svg { width: 16px; height: 16px; color: var(--primary); }
.toast.out { animation: toastOut .2s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

/* ===================== สถานะผิดพลาด ===================== */
.alert {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 14px 16px;
  border: 1px solid color-mix(in srgb, var(--destructive) 40%, transparent); border-radius: var(--radius);
  color: var(--destructive); background: color-mix(in srgb, var(--destructive) 6%, var(--card));
}
.alert svg { width: 16px; height: 16px; margin-top: 3px; grid-row: 1 / span 2; }
.alert h2 { margin: 0; font-size: 14px; font-weight: 600; }
.alert ul { margin: 4px 0 0; padding-left: 18px; color: var(--foreground); opacity: .85; }
.alert code { font-family: "Geist Mono", monospace; background: var(--muted); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

/* ===================== รองรับจอเล็ก ===================== */
@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 45; width: 272px !important;
    background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
    transform: translateX(-100%); transition: transform .25s;
  }
  .sidebar.show { transform: none; box-shadow: var(--shadow-lg); }
  .app.collapsed .brand-text, .app.collapsed .sb-btn .lbl, .app.collapsed .sb-btn .badge, .app.collapsed .sb-card div { display: revert; }
  .app.collapsed .sb-label { opacity: 1; height: 32px; }
  .app.collapsed .sb-btn { justify-content: flex-start; padding: 0 8px; }
  .inset { margin: 0; border-radius: 0; border: 0; box-shadow: none; }
  .header { border-radius: 0; padding: 0 12px; }
  .crumbs li.hide-sm, .crumbs li.hide-sm + li svg { display: none; }
  .search { width: auto; flex: 1; min-width: 0; }
  .search .kbd { display: none; }
  .content { padding: 16px; }
  .intro-art { display: none; }
  .atc-list { grid-template-columns: 1fr; }
  .select { flex: 1 1 150px; }
  .select select { width: 100%; min-width: 0; }
}
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr; }
  .card-header { padding: 16px 16px 0; }
  .card-content { padding: 14px 16px 16px; }
  .card-footer { padding: 0 16px 16px; }
  .card-header .card-action { grid-column: 1; grid-row: auto; }
  .toaster { left: 16px; }
  .toast { min-width: 0; max-width: none; }
}
</style>

/* =====================================================================
   1) ค่าคงที่: การจัดกลุ่มรูปแบบยา ไอคอน และชื่อกลุ่ม ATC ระดับที่ 1 (WHO)

   - ตารางด้านล่างเป็น "พจนานุกรม" สำหรับแปลรหัสเป็นคำอ่านเท่านั้น

};
const ICON_PILL = ICONS.capsule;
const ICON_SHAPES = svg('<path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>');

const ICON_UP = svg('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>');

const PG = {
  first: svg('<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>'),
  prev:  svg('<path d="m15 18-6-6 6-6"/>'),
  next:  svg('<path d="m9 18 6-6-6-6"/>'),

const FORM_GROUPS = [
  { name: "ยาเม็ด",            icon: "tablet",  forms: ["tablet", "chewable tablet", "sublingual tablet", "film-coated tablet"] },

const OTHER_GROUP = "อื่น ๆ";

  "tablet": "ยาเม็ด", "chewable tablet": "ยาเม็ดเคี้ยว", "sublingual tablet": "ยาเม็ดอมใต้ลิ้น",

  A: "ทางเดินอาหารและเมตาบอลิซึม", B: "เลือดและอวัยวะสร้างเลือด", C: "หัวใจและหลอดเลือด",

  N: "ระบบประสาท", P: "ยาต้านปรสิต", R: "ระบบทางเดินหายใจ", S: "อวัยวะรับความรู้สึก", V: "อื่น ๆ",
};
const UNIT_TH = { tablet: "เม็ด", capsule: "แคปซูล", bottle: "ขวด", tube: "หลอด", inhaler: "หลอดพ่น", sachet: "ซอง" };
const REQUIRED = ["sku", "generic_name", "strength", "dosage_form", "unit", "category", "atc_code", "reorder_level"];
// สีของกลุ่มรูปแบบยา = --chart-1..6 (ใช้ทั้ง donut, legend และไอคอนในตาราง)
const GROUP_COLORS = {
  light: ["#0d9488", "#0284c7", "#d97706", "#7c3aed", "#db2777", "#64748b"],
  dark:  ["#2dd4bf", "#38bdf8", "#fbbf24", "#a78bfa", "#f472b6", "#94a3b8"],
};

/* ตัวช่วยแปลงค่า */
const formToGroup = new Map();
FORM_GROUPS.forEach(g => g.forms.forEach(f => formToGroup.set(f, g.name)));
const groupOf = f => formToGroup.get(String(f).toLowerCase().trim()) || OTHER_GROUP;

async function load() {
  // เปิดไฟล์ตรง ๆ (file://) เบราว์เซอร์จะไม่ยอมให้ fetch
  if (location.protocol === "file:") {
    showError("เปิดไฟล์โดยตรงไม่ได้", [
      "เบราว์เซอร์บล็อกการอ่าน <code>drugs.json</code> เมื่อเปิดแบบ <code>file://</code>",
      "ให้เปิดผ่าน <b>Live Server</b> ใน VS Code (คลิกขวาที่ index.html → Open with Live Server)",
      "หรืออัปโหลดขึ้น <b>GitHub Pages</b> แล้วเปิดจากลิงก์นั้น",
    ]);
    return;
  }
  let res;
  try {
    res = await fetch("drugs.json", { cache: "no-cache" });
  } catch (e) {
    showError("เชื่อมต่อไม่ได้", ["ไม่สามารถอ่านไฟล์ <code>drugs.json</code> ได้: " + esc(e.message)]);
    return;
  }
  if (!res.ok) {
    showError("ไม่พบไฟล์ข้อมูล", [`โหลด <code>drugs.json</code> ไม่สำเร็จ (HTTP ${res.status})`, "ตรวจว่าไฟล์อยู่โฟลเดอร์เดียวกับ index.html และสะกดชื่อถูก"]);
    return;
  }
  let data;
  try {
    data = JSON.parse(await res.text());
  } catch (e) {
    showError("ไฟล์ไม่ใช่ JSON ที่ถูกต้อง", [esc(e.message), "ตรวจเครื่องหมาย , { } [ ] และเครื่องหมายคำพูดในไฟล์"]);
    return;
  }
  if (!data || !Array.isArray(data.items)) {
    showError("โครงสร้างข้อมูลไม่ถูกต้อง", ["ต้องมีฟิลด์ <code>items</code> ที่เป็น array"]);
    return;
  }
  const problems = [];
  data.items.forEach((it, i) => {
    const miss = REQUIRED.filter(k => it == null || it[k] === undefined || it[k] === null || it[k] === "");
    if (miss.length) problems.push(`รายการที่ ${i + 1} (SKU: <code>${esc(it && it.sku || "ไม่มี")}</code>) ขาดฟิลด์ ${miss.map(m => `<code>${m}</code>`).join(", ")}`);
  });
  if (problems.length) {
    showError(`ข้อมูลไม่ครบ ${problems.length} รายการ`, problems.slice(0, 20).concat(problems.length > 20 ? [`และอีก ${problems.length - 20} รายการ`] : []));
    return;
  }

  state.meta = data.meta || {};
  state.items = data.items.map(it => ({
    ...it,
    reorder_level: Number(it.reorder_level),
    _group: groupOf(it.dosage_form),
    _atc: atcOf(it.atc_code),
  }));
  buildPage();
}

/* =====================================================================
   6) ตัวกรอง: ฟังก์ชันกรองโดย "ยกเว้น" ตัวกรองบางตัวได้
   (ให้กราฟหมวดยังเห็นทุกหมวด แม้เลือกหมวดใดหมวดหนึ่งอยู่)
   ===================================================================== */
function filtered(except) {
  const q = state.q.trim().toLowerCase();
  return state.items.filter(it =>
    (except === "category" || !state.category || it.category === state.category) &&
    (except === "group" || !state.group || it._group === state.group) &&
    (except === "atc" || !state.atc || it._atc === state.atc) &&
    (!q || it.generic_name.toLowerCase().includes(q) || it.sku.toLowerCase().includes(q) || it.atc_code.toLowerCase().includes(q))
  );
}
const countBy = (arr, key) => arr.reduce((m, it) => m.set(it[key], (m.get(it[key]) || 0) + 1), new Map());
// นับตัวยาสามัญที่ไม่ซ้ำ ต่อค่าของ key
const countUniqueBy = (arr, key) => {
  const sets = new Map();
  arr.forEach(it => { if (!sets.has(it[key])) sets.set(it[key], new Set()); sets.get(it[key]).add(it.generic_name); });
  return new Map([...sets].map(([k, s]) => [k, s.size]));
};

let lastFilterKey = "";
function render() {
  const rows = filtered();

  const key = [state.category, state.group, state.atc, state.q].join("|");
  if (key !== lastFilterKey) { state.page = 1; lastFilterKey = key; }
  [["fCat", "category"], ["fGroup", "group"], ["fAtc", "atc"]].forEach(([id, k]) => {
    $(id).value = state[k];
    $(id).classList.toggle("on", !!state[k]);
  });
  renderChips();
  renderKpis(rows);

  renderAtc();
  renderTable(rows);
}

/* ---------- ตัวเลขนับขึ้น ---------- */
function countUp(el, to, suffix) {
  const from = el._v ?? 0;
  el._v = to;
  if (reduceMotion || from === to) { el.innerHTML = fmt(to) + suffix; return; }
  const t0 = performance.now(), dur = 650;
  cancelAnimationFrame(el._raf);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = fmt(from + (to - from) * e) + suffix;
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

/* ---------- KPI 4 การ์ด (แบบ SectionCards ของ shadcn dashboard-01) ---------- */
function renderKpis(rows) {
  const total = state.items.length;
  const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
  const prim = cssVar("--primary");

  // 1) จำนวน SKU
  countUp($("kSku"), rows.length, "<small>SKU</small>");
  $("kSkuBadge").innerHTML = `${ICON_TREND}${pct(rows.length, total)}%`;
  $("kSkuMain").innerHTML = `<span>${rows.length === total ? "แสดงครบทุกรายการ" : "กำลังกรองข้อมูล"}</span>${ICON_LAYERS}`;
  $("kSkuSub").textContent = `${fmt(rows.length)} จาก ${fmt(total)} รายการในบัญชี`;
  $("kSkuBar").innerHTML = `<span style="width:${pct(rows.length, total)}%;background:${prim}"></span>`;

  // 2) หมวดยา
  const cats = [...countBy(rows, "category")].sort((a, b) => b[1] - a[1]);
  countUp($("kCat"), cats.length, "<small>หมวด</small>");
  $("kCatBadge").innerHTML = `${ICON_SHAPES}${cats.length}/${state.cats.length}`;
  $("kCatMain").innerHTML = cats.length ? `<span>มากสุด: ${esc(cats[0][0])}</span>` : "<span>—</span>";
  $("kCatSub").textContent = cats.length ? `${cats[0][1]} รายการในหมวดนี้` : "ไม่มีข้อมูล";
  $("kCatBar").innerHTML = `<span style="width:${pct(cats.length, state.cats.length)}%;background:${prim}"></span>`;

  // 3) ตัวยาสามัญ
  const gens = [...countBy(rows, "generic_name")];
  const multi = gens.filter(g => g[1] > 1).map(g => g[0]);
  countUp($("kGen"), gens.length, "<small>ตัว</small>");
  $("kGenBadge").innerHTML = `${ICON_FLASK}${multi.length} หลาย SKU`;
  $("kGenMain").innerHTML = `<span>${multi.length ? `${multi.length} ตัวมีหลายขนาด/รูปแบบ` : "ไม่มีตัวยาที่มีหลาย SKU"}</span>`;
  $("kGenSub").textContent = multi.length ? multi.slice(0, 3).join(", ") + (multi.length > 3 ? ` +${multi.length - 3}` : "") : "ทุกตัวยามี SKU เดียว";
  $("kGenBar").innerHTML = gens.length ? `<span style="width:${(gens.length - multi.length) / gens.length * 100}%;background:${prim}"></span><span style="width:${multi.length / gens.length * 100}%;background:${prim};opacity:.4"></span>` : "";

  // 4) รูปแบบหลัก
  const groups = [...countBy(rows, "_group")].sort((a, b) => b[1] - a[1]);
  const kf = $("kForm");
  kf.classList.add("text");
  if (groups.length) {
    kf.textContent = groups[0][0];
    $("kFormBadge").innerHTML = `${ICON_PIE}${pct(groups[0][1], rows.length)}%`;
    $("kFormMain").innerHTML = `<span>${groups.length} รูปแบบในผลลัพธ์</span>`;
    $("kFormSub").textContent = groups.slice(1, 3).map(g => `${g[0]} ${pct(g[1], rows.length)}%`).join(" · ") || "มีรูปแบบเดียว";
    $("kFormBar").innerHTML = state.groups.map(g => {
      const n = (groups.find(x => x[0] === g) || [0, 0])[1];
      return `<span style="width:${n / rows.length * 100}%;background:${groupColor(g)}" title="${esc(g)} ${n}"></span>`;
    }).join("");
  } else {
    kf.textContent = "–"; $("kFormBadge").innerHTML = ICON_PIE; $("kFormMain").innerHTML = ""; $("kFormSub").textContent = ""; $("kFormBar").innerHTML = "";
  }
}

/* ---------- กราฟ (Chart.js สไตล์ shadcn charts) ---------- */
const barLabels = {
  id: "barLabels",
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    ctx.save();
    ctx.font = "600 12px Geist, 'IBM Plex Sans Thai', sans-serif";
    ctx.fillStyle = cssVar("--foreground");
    ctx.textBaseline = "middle";
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      ctx.globalAlpha = chart.$dim && chart.$dim[i] ? 0.4 : 1;
      ctx.fillText(chart.data.datasets[0].data[i], bar.x + 8, bar.y);
    });
    ctx.restore();
  },
};
const donutCenter = {
  id: "donutCenter",
  afterDraw(chart) {
    const { ctx, chartArea: a } = chart;
    const total = chart.data.datasets[0].data.reduce((s, v) => s + v, 0);
    const x = (a.left + a.right) / 2, y = (a.top + a.bottom) / 2;
    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = cssVar("--foreground");
    ctx.font = "700 28px Geist, sans-serif";
    ctx.fillText(total, x, y + 4);
    ctx.fillStyle = cssVar("--muted-foreground");
    ctx.font = "12px 'IBM Plex Sans Thai', sans-serif";
    ctx.fillText("รายการ", x, y + 23);
    ctx.restore();
  },
};
const barColor = c => (c.chart.$dim && c.chart.$dim[c.dataIndex]) ? cssVar("--muted") : cssVar("--primary");

function showBarInfo(cat) {
  const box = $("barInfo");
  if (!box) return;
  const c = cat || state.category;
  if (!c) {
    box.classList.remove("on");
    box.innerHTML = "ชี้ที่แท่งกราฟเพื่อดูรายชื่อยาในหมวดนั้น";
    return;
  }
  const rows = filtered("category").filter(it => it.category === c);
  const names = [...new Set(rows.map(it => it.generic_name))];
  box.classList.add("on");
  box.innerHTML = `<b>${esc(c)}</b><span class="n num">${rows.length} SKU · ${names.length} ตัวยา</span>
    <div class="names">${names.length ? esc(names.slice(0, 10).join(", ")) + (names.length > 10 ? ` และอีก ${names.length - 10} ตัว` : "") : "ไม่มีรายการที่ตรงกับตัวกรอง"}</div>`;
}

function renderCharts() {
  if (typeof Chart === "undefined") {
    $("barWrap").innerHTML = '<p class="card-desc">โหลด Chart.js ไม่ได้ (ตรวจการเชื่อมต่ออินเทอร์เน็ต)</p>';
    return;
  }
  Chart.defaults.font.family = "Geist, 'IBM Plex Sans Thai', sans-serif";
  Chart.defaults.color = cssVar("--muted-foreground");
  // tooltip แบบ ChartTooltipContent: พื้น popover ขอบบาง ตัวเล็ก
  const tooltip = {
    backgroundColor: cssVar("--popover"), borderColor: cssVar("--border"), borderWidth: 1,
    titleColor: cssVar("--foreground"), bodyColor: cssVar("--muted-foreground"),
    padding: 10, cornerRadius: 8, boxPadding: 6, usePointStyle: true,
    titleFont: { size: 12, weight: "600" }, bodyFont: { size: 12 },
  };

  /* ---- กราฟแท่ง: นับตามหมวด โดยไม่สนตัวกรองหมวด ---- */
  const counter = state.barMetric === "gen" ? countUniqueBy : countBy;
  const base = filtered("category");
  const byCat = counter(base, "category");
  const allCount = counter(state.items, "category");
  const cats = state.cats.map(c => [c, byCat.get(c) || 0]).sort((a, b) => allCount.get(b[0]) - allCount.get(a[0]));
  const labels = cats.map(c => c[0]), values = cats.map(c => c[1]);
  const dim = labels.map(c => !!state.category && c !== state.category);
  $("barWrap").style.height = (labels.length * 30 + 10) + "px";

  if (charts.bar) {
    charts.bar.$dim = dim;
    charts.bar.data.labels = labels;
    charts.bar.data.datasets[0].data = values;
    charts.bar.options.scales.y.ticks.color = cssVar("--foreground");
    charts.bar.update();
  } else {
    charts.bar = new Chart($("barChart"), {
      type: "bar",
      data: { labels, datasets: [{ data: values, backgroundColor: barColor, borderRadius: 4, borderSkipped: false, barThickness: 16 }] },
      options: {
        indexAxis: "y", maintainAspectRatio: false,
        animation: { duration: reduceMotion ? 0 : 500 },
        layout: { padding: { right: 30 } },
        scales: {
          x: { display: false, beginAtZero: true },
          y: { grid: { display: false }, border: { display: false }, ticks: { color: cssVar("--foreground"), font: { size: 12.5 } } },
        },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        onClick: (e, els) => {
          if (!els.length) return;
          const c = charts.bar.data.labels[els[0].index];
          state.category = state.category === c ? "" : c;
          render();
        },
        onHover: (e, els) => {
          e.native.target.style.cursor = els.length ? "pointer" : "default";
          const c = els.length ? charts.bar.data.labels[els[0].index] : null;
          if (c !== charts.bar.$hover) { charts.bar.$hover = c; showBarInfo(c); }
        },
      },
      plugins: [barLabels],
    });
    charts.bar.$dim = dim;
  }
  showBarInfo(charts.bar.$hover);

  /* ---- Donut: นับตามกลุ่มรูปแบบยา โดยไม่สนตัวกรองรูปแบบ ---- */
  const byG = countBy(filtered("group"), "_group");
  const gLabels = state.groups, gValues = gLabels.map(g => byG.get(g) || 0);
  const gColors = gLabels.map(g => groupColor(g) + (!state.group || g === state.group ? "" : "33"));
  const sum = gValues.reduce((s, v) => s + v, 0);
  const label = t => ` ${t.raw} รายการ (${sum ? Math.round(t.raw / sum * 100) : 0}%)`;

  if (charts.donut) {
    Object.assign(charts.donut.data.datasets[0], { data: gValues, backgroundColor: gColors, borderColor: cssVar("--card") });
    Object.assign(charts.donut.options.plugins.tooltip, tooltip, { callbacks: { label } });
    charts.donut.update();
  } else {
    charts.donut = new Chart($("donutChart"), {
      type: "doughnut",
      data: { labels: gLabels, datasets: [{ data: gValues, backgroundColor: gColors, borderColor: cssVar("--card"), borderWidth: 3, borderRadius: 4, hoverOffset: 6 }] },
      options: {
        maintainAspectRatio: false, cutout: "68%",
        animation: { duration: reduceMotion ? 0 : 700 },
        plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: { label } } },
        onClick: (e, els) => {
          if (!els.length) return;
          const g = gLabels[els[0].index];
          state.group = state.group === g ? "" : g;
          render();
        },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; },
      },
      plugins: [donutCenter],
    });
  }
  $("donutLegend").innerHTML = gLabels.map((g, i) => {
    const cls = state.group ? (g === state.group ? "sel" : "dim") : "";
    const pct = sum ? Math.round(gValues[i] / sum * 100) : 0;
    return `<li class="${cls}" data-g="${esc(g)}" tabindex="0" role="button">
      <span class="sw" style="background:${groupColor(g)}"></span>${esc(g)}
      <span class="v num"><b>${gValues[i]}</b> · ${pct}%</span></li>`;
  }).join("");
  $("donutLegend").querySelectorAll("li").forEach(li => {
    const go = () => { state.group = state.group === li.dataset.g ? "" : li.dataset.g; render(); };
    li.onclick = go;
    li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

/* ---------- กลุ่ม ATC (Progress) ---------- */
function renderAtc() {
  const base = filtered("atc");
  const by = countBy(base, "_atc");
  const all = countBy(state.items, "_atc");
  const list = state.atcs.map(a => [a, by.get(a) || 0]).sort((x, y) => all.get(y[0]) - all.get(x[0]) || x[0].localeCompare(y[0]));
  const max = Math.max(1, ...list.map(l => l[1]));
  const total = base.length || 1;
  $("atcList").innerHTML = list.map(([a, n]) => {
    const cls = state.atc ? (a === state.atc ? "sel" : "dim") : "";
    return `<button class="atc-row ${cls}" data-a="${esc(a)}">
      <div class="atc-top"><span class="atc-code">${esc(a)}</span>${esc(atcName(a))}
      <span class="v num">${n}<small>${Math.round(n / total * 100)}%</small></span></div>
      <div class="progress"><span style="width:${n / max * 100}%"></span></div></button>`;
  }).join("");
  $("atcList").querySelectorAll(".atc-row").forEach(b => b.onclick = () => {
    state.atc = state.atc === b.dataset.a ? "" : b.dataset.a;
    render();
  });
}

/* ---------- ตารางรายการยา (Data table + Pagination) ---------- */
const COLS = [
  { k: "sku", t: "SKU" },
  { k: "generic_name", t: "ชื่อสามัญ" },
  { k: "strength", t: "ความแรง" },
  { k: "dosage_form", t: "รูปแบบ" },
  { k: "category", t: "หมวด" },
  { k: "atc_code", t: "ATC" },
  { k: "reorder_level", t: "จุดสั่งซื้อ", r: true },
];
function renderTable(rows) {
  $("thead").innerHTML = COLS.map(c => {
    const on = state.sortKey === c.k;
    const ic = on ? (state.sortDir > 0 ? ICON_UP : ICON_DOWN) : ICON_SORT;
    return `<th class="${c.r ? "r " : ""}${on ? "sorted" : ""}" aria-sort="${on ? (state.sortDir > 0 ? "ascending" : "descending") : "none"}">
      <button class="sort" data-k="${c.k}">${c.t}${ic}</button></th>`;
  }).join("");
  $("thead").querySelectorAll(".sort").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    state.sortDir = state.sortKey === k ? -state.sortDir : 1;
    state.sortKey = k;
    renderTable(filtered());
  });

  const k = state.sortKey, d = state.sortDir;
  const val = it => k === "category" ? state.cats.indexOf(it.category) : it[k];
  const sorted = [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), "th")) * d || a.sku.localeCompare(b.sku);
  });

  // แบ่งหน้า
  const size = state.pageSize || sorted.length || 1;
  const pages = Math.max(1, Math.ceil(sorted.length / size));
  state.page = Math.min(Math.max(1, state.page), pages);
  const start = (state.page - 1) * size;
  const view = sorted.slice(start, start + size);
  $("tCount").textContent = `${fmt(rows.length)} / ${fmt(state.items.length)} รายการ`;
  $("pgInfo").textContent = sorted.length ? `แสดง ${fmt(start + 1)}–${fmt(start + view.length)} จาก ${fmt(sorted.length)} รายการ` : "ไม่มีรายการ";
  $("pgNow").textContent = `หน้า ${state.page} จาก ${pages}`;
  $("pgFirst").disabled = $("pgPrev").disabled = state.page <= 1;
  $("pgNext").disabled = $("pgLast").disabled = state.page >= pages;
  $("pgSize").value = String(state.pageSize);

  if (!view.length) {
    $("tbody").innerHTML = `<tr><td class="empty" colspan="${COLS.length}">
      <div class="empty-ico">${ICON_SEARCHX}</div><b>ไม่พบรายการที่ตรงกับตัวกรอง</b>ลองเปลี่ยนคำค้นหรือกด “ล้างตัวกรอง”</td></tr>`;
    return;
  }
  $("tbody").innerHTML = view.map(it => `
    <tr data-sku="${esc(it.sku)}" class="${state.selected === it.sku ? "active" : ""}" tabindex="0">
      <td class="sku">${esc(it.sku)}</td>
      <td><div class="name-cell">${formBadge(it._group)}<span class="gname">${esc(it.generic_name)}</span></div></td>
      <td>${esc(it.strength)}</td>
      <td>${esc(FORM_TH[it.dosage_form] || it.dosage_form)}</td>
      <td>${catBadge(it.category)}</td>
      <td class="sku">${esc(it.atc_code)}</td>
      <td class="r num"><b>${fmt(it.reorder_level)}</b> <span style="color:var(--muted-foreground)">${esc(UNIT_TH[it.unit] || it.unit)}</span></td>
    </tr>`).join("");
  $("tbody").querySelectorAll("tr").forEach(tr => {
    tr.onclick = () => openDrawer(tr.dataset.sku);
    tr.onkeydown = e => { if (e.key === "Enter") openDrawer(tr.dataset.sku); };
  });
}

/* =====================================================================
   8) Sheet รายละเอียดยา (คลิกแถวในตาราง)
   ===================================================================== */
function openDrawer(sku) {
  const it = state.items.find(x => x.sku === sku);
  if (!it) return;
  state.selected = sku;
  const unit = UNIT_TH[it.unit] || it.unit;
  const code = it.atc_code;
  const levels = [
    [code.slice(0, 1), atcName(code[0])],
    [code.slice(0, 3), "กลุ่มการรักษา"],
    [code.slice(0, 4), "กลุ่มย่อยทางเภสัชวิทยา"],
    [code.slice(0, 5), "กลุ่มย่อยทางเคมี"],
    [code, "ตัวยา: " + it.generic_name],
  ].filter(l => l[0]);
  const siblings = state.items.filter(x => x.generic_name === it.generic_name && x.sku !== it.sku);

  $("drawer").innerHTML = `
    <button class="btn btn-ghost btn-icon-xs sheet-close" id="closeDrawer" aria-label="ปิด">${ICON_X}</button>
    <div class="sheet-header">
      ${formBadge(it._group)}
      <div><h3 class="sheet-title" id="sheetTitle">${esc(it.generic_name)}</h3>
      <p class="sheet-desc">${esc(it.strength)} · <span class="sku">${esc(it.sku)}</span></p></div>
    </div>
    <div class="sheet-body">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">${catBadge(it.category)}<span class="badge badge-secondary">${esc(it._group)}</span></div>
      <div class="facts">
        <div class="fact"><span>รูปแบบยา</span><b>${esc(FORM_TH[it.dosage_form] || it.dosage_form)}</b></div>
        <div class="fact"><span>หน่วยนับ</span><b>${esc(unit)}</b></div>
        <div class="fact"><span>จุดสั่งซื้อ</span><b class="num">${fmt(it.reorder_level)} ${esc(unit)}</b></div>
        <div class="fact"><span>รหัส ATC</span><b class="mono">${esc(code)}</b></div>
      </div>
      <hr class="separator">
      <h4 class="sub-title">ลำดับชั้นรหัส ATC</h4>
      <div class="atc-path">${levels.map(l => `<div><code>${esc(l[0])}</code>${esc(l[1])}</div>`).join("")}</div>
      ${siblings.length ? `<hr class="separator"><h4 class="sub-title">${esc(it.generic_name)} ขนาด/รูปแบบอื่นในร้าน</h4>
        ${siblings.map(s => `<button class="sib" data-sku="${esc(s.sku)}">${formBadge(s._group)}<span><b>${esc(s.strength)}</b> · ${esc(FORM_TH[s.dosage_form] || s.dosage_form)}<br><span class="sku">${esc(s.sku)}</span></span></button>`).join("")}` : ""}
    </div>
    <div class="sheet-footer">
      <button class="btn btn-outline" id="copySku">${ICON_COPY}คัดลอก SKU</button>
      <button class="btn btn-primary" id="filterCat">กรองหมวดนี้</button>
    </div>`;
  $("drawer").classList.add("show");
  $("drawer").setAttribute("aria-hidden", "false");
  $("scrim").classList.add("show");
  $("closeDrawer").onclick = closeDrawer;
  $("closeDrawer").focus();
  $("copySku").onclick = async () => {
    try { await navigator.clipboard.writeText(it.sku); toast(`คัดลอก ${it.sku} แล้ว`); }
    catch (e) { toast("คัดลอกไม่ได้ในเบราว์เซอร์นี้"); }
  };
  $("filterCat").onclick = () => {
    state.category = it.category;
    closeDrawer();
    render();
    toast(`กรองหมวด “${it.category}”`);
  };
  $("drawer").querySelectorAll(".sib").forEach(b => b.onclick = () => openDrawer(b.dataset.sku));
  document.querySelectorAll("#tbody tr").forEach(tr => tr.classList.toggle("active", tr.dataset.sku === sku));
}
function closeDrawer() {
  state.selected = null;
  $("drawer").classList.remove("show");
  $("drawer").setAttribute("aria-hidden", "true");
  $("scrim").classList.remove("show");
  document.querySelectorAll("#tbody tr.active").forEach(tr => tr.classList.remove("active"));
}

/* =====================================================================
   9) Sidebar มือถือ, คีย์ลัด และไฮไลต์ส่วนที่กำลังดู
   ===================================================================== */
$("scrim").onclick = () => { $("sidebar").classList.remove("show"); closeDrawer(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeDrawer(); $("sidebar").classList.remove("show"); }
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  // "/" หรือ Ctrl+K = ไปช่องค้นหา, Ctrl+B = ย่อ/ขยาย sidebar (เหมือน shadcn)
  if ((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")) {
    e.preventDefault(); $("q").focus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") { e.preventDefault(); toggleSidebar(); }
});
document.querySelectorAll("[data-nav]").forEach(a => a.addEventListener("click", () => {
  $("sidebar").classList.remove("show");
  if (!$("drawer").classList.contains("show")) $("scrim").classList.remove("show");
}));
const NAV_TH = { overview: "ภาพรวม", charts: "กราฟ", list: "รายการยา" };
window.addEventListener("scroll", () => {
  let cur = "overview";
  ["overview", "charts", "list"].forEach(id => {
    const el = $(id);
    if (el && el.getBoundingClientRect().top < 200) cur = id;
  });
  // เลื่อนจนสุดหน้าแล้ว = อยู่ส่วนสุดท้ายเสมอ
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = "list";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + cur));
  $("crumbCur").textContent = NAV_TH[cur];
}, { passive: true });

/* เริ่มทำงาน */
load();
</script>
